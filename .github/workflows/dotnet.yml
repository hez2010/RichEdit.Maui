name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to NuGet"
        required: true
        type: boolean
        default: false

jobs:
  build:

    runs-on: windows-latest

    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
    
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore workloads
      run: dotnet workload restore
    - name: Build
      run: dotnet build -c Release
    - name: Test document cores
      run: |
        dotnet run --project TextEdit.Core.Tests -c Release -- -parallelMode none -nocolor
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet run --project RichEdit.Core.Tests -c Release -- -parallelMode none -nocolor
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Pack
      if: success()
      run: |
        dotnet pack RichEdit.Maui -c Release -o artifacts
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet pack CodeEdit.Maui -c Release -o artifacts
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Verify NuGet package contents
      shell: pwsh
      run: ./.github/scripts/VerifyPackages.ps1 artifacts

    - name: NuGet login
      if: success() && github.event_name == 'workflow_dispatch' && inputs.publish
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: NuGet push
      if: success() && github.event_name == 'workflow_dispatch' && inputs.publish
      shell: pwsh
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: |
        $packages = foreach ($id in @('RichEdit.Maui', 'CodeEdit.Maui')) {
          $matchingPackages = @(Get-ChildItem artifacts -Filter "$id.*.nupkg" -File)
          if ($matchingPackages.Count -ne 1) { throw "Expected exactly one $id package in artifacts." }
          $matchingPackages[0]
        }
        foreach ($package in $packages) {
          dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
